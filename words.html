<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>降りてきた言葉</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;600&family=Zen+Kaku+Gothic+New:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f7f2ea; --bg2:#efe6d8; --ink:#3b342c; --soft:#8a7d6d; --line:#ded2bf;
    --glow:rgba(232,196,120,.38); --accent:#b98a3e;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#1d1a17; --bg2:#26221d; --ink:#ece4d6; --soft:#a39683; --line:#3a342c;
      --glow:rgba(214,170,90,.28); --accent:#d9b06a;
    }
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:radial-gradient(120% 80% at 50% 0%, var(--bg2), var(--bg) 60%);
    color:var(--ink);
    font-family:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
    -webkit-tap-highlight-color:transparent;
    overflow:hidden;
  }
  .app{
    height:100%; display:flex; flex-direction:column;
    padding:calc(env(safe-area-inset-top) + 18px) 0 calc(env(safe-area-inset-bottom) + 14px);
    max-width:640px; margin:0 auto;
  }
  header{
    display:flex; align-items:center; justify-content:space-between;
    padding:0 22px 10px; font-family:"Zen Kaku Gothic New",sans-serif;
    color:var(--soft); font-size:12px; letter-spacing:.12em;
  }
  header .ttl{font-family:"Shippori Mincho",serif; font-size:14px; color:var(--ink); letter-spacing:.2em}
  .icon-btn{
    background:none; border:none; color:var(--soft); font:inherit; font-size:12px;
    padding:8px 6px; cursor:pointer; letter-spacing:.1em;
  }
  .stage{
    flex:1; position:relative; overflow:hidden;
  }
  .card{
    position:absolute; inset:0; overflow-y:auto; -webkit-overflow-scrolling:touch;
    padding:18px 28px 40px;
    transition:opacity .45s ease, transform .45s ease;
  }
  .card.out{opacity:0; transform:translateY(8px)}
  .num{
    font-family:"Zen Kaku Gothic New",sans-serif; font-size:11px; color:var(--accent);
    letter-spacing:.3em; margin-bottom:6px;
  }
  .label{
    font-size:13px; color:var(--soft); letter-spacing:.15em; margin-bottom:22px;
  }
  .label::after{
    content:""; display:block; width:28px; height:1px; background:var(--accent);
    margin-top:14px; opacity:.6;
  }
  .text{
    font-size:17.5px; line-height:2.15; letter-spacing:.04em; text-align:justify;
  }
  .text .hl{
    font-style:normal;
    background:linear-gradient(transparent 58%, var(--glow) 58%);
    font-weight:600;
  }
  .hint{
    text-align:center; font-family:"Zen Kaku Gothic New",sans-serif; font-size:11px;
    color:var(--soft); letter-spacing:.15em; margin-top:34px; opacity:.7;
  }
  footer{padding:8px 22px 0; display:flex; flex-direction:column; gap:12px; align-items:center}
  .dots{display:flex; gap:7px; flex-wrap:wrap; justify-content:center}
  .dot{
    width:7px; height:7px; border-radius:50%; background:var(--line); border:none; padding:0;
    cursor:pointer; transition:background .3s, transform .3s;
  }
  .dot.on{background:var(--accent); transform:scale(1.25)}
  .nav{display:flex; width:100%; justify-content:space-between; font-family:"Zen Kaku Gothic New",sans-serif}
  .nav button{
    background:none; border:1px solid var(--line); color:var(--soft); border-radius:999px;
    font:inherit; font-size:12px; letter-spacing:.12em; padding:8px 16px; cursor:pointer;
  }
  .nav .mid{border:none}
  /* index overlay */
  .overlay{
    position:fixed; inset:0; background:var(--bg); z-index:10;
    padding:calc(env(safe-area-inset-top) + 22px) 24px calc(env(safe-area-inset-bottom) + 22px);
    overflow-y:auto; opacity:0; pointer-events:none; transition:opacity .35s;
  }
  .overlay.show{opacity:1; pointer-events:auto}
  .overlay h2{font-size:15px; font-weight:600; letter-spacing:.2em; margin:0 auto 20px; max-width:592px;
    display:flex; justify-content:space-between; align-items:center}
  .overlay ol{list-style:none; max-width:592px; margin:0 auto}
  .overlay li{border-top:1px solid var(--line)}
  .overlay li:last-child{border-bottom:1px solid var(--line)}
  .overlay li button{
    display:block; width:100%; text-align:left; background:none; border:none; color:var(--ink);
    font:inherit; padding:15px 4px; cursor:pointer; line-height:1.7;
  }
  .overlay .n{font-family:"Zen Kaku Gothic New",sans-serif; color:var(--accent); font-size:11px; letter-spacing:.2em; margin-right:10px}
  .overlay .l{font-size:14px; letter-spacing:.1em}
  .overlay .p{display:block; font-size:12px; color:var(--soft); margin-top:2px; overflow:hidden; white-space:nowrap; text-overflow:ellipsis}
</style>
</head>
<body>
<div class="app">
  <header>
    <button class="icon-btn" id="openIndex">目次</button>
    <span class="ttl">降りてきた言葉</span>
    <span class="icon-btn" style="visibility:hidden">目次</span>
  </header>

  <div class="stage" id="stage">
    <article class="card" id="card">
      <div class="num" id="num"></div>
      <div class="label" id="label"></div>
      <div class="text" id="text"></div>
      <div class="hint" id="hint">タップで次の言葉へ</div>
    </article>
  </div>

  <footer>
    <div class="dots" id="dots"></div>
    <div class="nav">
      <button id="prev">← 戻る</button>
      <button class="mid" id="count"></button>
      <button id="next">次の言葉 →</button>
    </div>
  </footer>
</div>

<div class="overlay" id="overlay">
  <h2><span>目次</span><button class="icon-btn" id="closeIndex">閉じる</button></h2>
  <ol id="list"></ol>
</div>

<script>
const W = [

{l:"悲劇を発見する",
t:"「私」が見ている悲劇を発見しなさい。**あなたが「ほんとう」だと思うことは神の愛のみでありなさい**。悲劇の中で獲得する全ての報酬を放棄しなさい。「与えられない私」という被害者意識と「“私”の力で獲る」という虚栄心を全て放棄しなさい。心が得るものは刹那的で対極の不幸を常に必要とします。神に対極はありません。喜びと無限のエネルギーのみを求め、そして与えられなさい。"},

{l:"無限の水源から受け取る",
t:"こうしたら手に入る、という「手段」や「取引」や「条件付け」は全て、水を求める状況で自ら傘をさす行為だと気付きなさい。あなたの心は何も知ってはいません。**既に全ては条件なく常に与えられ、帰結し、顕在していることを悟りなさい**。「私」に出来ることは何も無く、ただ受け取るだけでいいのだと悟りなさい。そして、与えたいなら、この無限の水源から受け取りなさい。心は「私」が手に入れた水を与えることはできないでしょう。「私」は測り、そして、減ったり、失ったり、欠如すると信じているからです。**失われるものは無限の水源ではありません**。"},

{l:"愛したいなら、神から受け取る",
t:"愛したいなら、神から受け取りなさい。**神は全てを存在させている根源です。特別なものは何一つありません**。どんなものも平等に源から生まれています。優劣も、価値の大きさも、心が解釈したものに過ぎません。**全ては与えられ続け、存在し、創造され続けています**。あなたが満たされたと感じたものも、全て源から与えられているエネルギーから来ています。"},

{l:"源の愛は、無条件で無限",
t:"不完全で、犠牲を伴うものは源は与えていません。**それらを与えられたと感じるのは、あなたがその不完全性や犠牲という形を活用するシステムと同一化しているからです**。純粋な源の体感のみを求めなさい。**全ての解釈と意味付けを放棄しなさい。喜びも、豊かさも、困難も、障害も、全ては求めたら与えられます**。困難や苦労の道を選ぶことは美しいことでも、正義でも、条件でもありません。**純粋な愛のみが今この瞬間にも与えられている“存在させる”ことの根源的なエネルギーです**。許可したり、溜め込んだり、削られたりする必要があるものは愛ではありません。それらは心が解釈を加えたものです。**源の愛は、無条件で、無限です。**"},

{l:"愛に徹底的に降伏する",
t:"愛に徹底的に降伏しなさい。あなたが愛に満たされることが、この世に愛をもたらすことです。**心の証明や論証で愛を受け取ることはできないのだと謙虚に受け止めなさい**。心に出来ることは何もありません。ただ、愛から形を喜び、全ての存在を楽しむだけでいいのです。困難や問題や障害も、神の光のみが消し去ります。**あらゆるものを存在させるエネルギーである源に勝るものは何もないのだと悟りなさい**。全ての抵抗をやめ、与えられなさい。**愛の与えるという性質に身を委ねるのです**。愛を与える時、失われるものも、犠牲になるものも何一つありません。あなたは喜びと心地よさを必ず感じます。"},

{l:"「神が与えてくれた」と選ぶ",
t:"**今あなたが見ている景色、触れているもの、これらのあらゆるものは、神が与えたものです**。心が獲得したものは何一つありません。しかし、心にもできることが一つだけあります。それは、このように、**「神が与えてくれた」という解釈で新たな選択肢を作ること**です。神から授かった心という機能を良き従者として従えなさい。選択とは生命の生得の性質です。'受け取ること'はカルマとして存在しています。**'受け取る'ということは、何の条件達成も必要なく自動的に「選択」されること**なのです。善悪や優劣という心の判断は使わず、神にのみ降伏し、受け取りなさい。**無限のものは、どれだけでも与えることが可能です**。"},

{l:"謙虚に知る",
t:"**あなたが悩んだり、苦労したり、うまくいかないということができるのは、源のエネルギーを受け取ってはじめてできていることであると謙虚に知りなさい**。あなたが存在するのは神の愛によるものです。**愛と喜びに心で抵抗し、虚栄心や著者性を持つことを放棄しなさい**。自明である愛に抵抗することは何の愛ももたらしません。**今目の前にあるものは全て、源の不動で尽きることのないエネルギーから供給されているものです**。そこに、外の世界の「原因」や、「私が」「何者かによって」と著者性を加えた解釈をしないことです。神の愛に気が付けば、その圧倒的な実在に、心が静かになるのを感じるでしょう。**これらは謙虚さによって知ることのできる世界です。**その愛の臨在に触れた時、あなたは無限で尽きることのないエネルギーを感じ、世界に与えることになるでしょう。"},

{l:"神は呼吸をするように",
t:"神は呼吸をするように、絶え間なく与え続け、創造と展開しています。今この瞬間にも、あなたを通して愛がもたらされ続けています。非線形から降りてきたさまざまなイメージや目標を通して、神は創造を行います。**これらに抵抗することをやめなさい**。これらは**個人的なあなたが描いたものではなく、非線形に源から与えられたものであると気づきなさい**。あなたは神からあらゆることを条件なくいつでも体験できる機会を授かっているのです。ここにどんな制限も条件もありません。**喜びや美を求めなさい。**そしてそれらへの心の解釈を放棄するのです。心が解釈し描いた苦悩や悲劇のイメージへ同一化することは、心の報酬となり、それらは展開し、カルマは継続されるでしょう。しかし、心の抵抗よりも、**喜びと十全性を選択する意志を持ちなさい**。これらは世界へ光を届け、愛を与え、そして心自身も癒すことになるでしょう。"},

{l:"小ささは神の性質ではない",
t:"己を小さきものとして「値しない」と見ることをやめなさい。あなたは源にのみ全てを与えられ存在していることを知りました。神の愛は無限で、非局所的で、全ての究極の根源です。小ささは神の性質ではありません。**喜びや十全性への抵抗の根源は、心が最後に唯一握りしめた「相応しくない私」という著者性です**。この心の偽りの謙虚さを見抜きなさい。神は恩寵への条件は何も与えていません。与えられる者と与えられざる者という二元性は心の解釈に過ぎません。**悲観するのをやめ、被害者意識を持つことをやめ、個人的な「私」に自己陶酔することをやめなさい**。神に完全に明け渡したとき、求めることが全て与えられることを悟るでしょう。"},

{l:"神に相応しいのは神の性質のみ",
t:"どんなものも神に求めなさい。そして、今あなたの目の前にあるもの、全てはすでに神によって与えられたものです。もしも与えられたものに対し、ネガティブな感情が湧くのであれば、**それらは“自分”がその時に必要だと認めたものたちだと理解しなさい**。神は「あなたに悲劇が必要です」と言ったことは一度もありません。それはあなたが、**神ではなく、悲劇に何かを求め、得たから**です。神は全てを与えます。そして、神は喜びしか与えていないことをあなたは知っています。**「私」に「相応しい」形を求めるのをやめなさい**。あなたは神の意識と共にあります。神に相応しいのは神の性質のみです。"},

{l:"光で心を癒す",
t:"**心を常に神へ向けなさい**。神は特定のどこかにはいません。すでにここに存在しています。あなたに意識がある以上、あなたは神の中にいます。心が「悲劇」という虚栄の世界に自己陶酔をしようとした時、あなた自身が自らの心を照らすのです。神に背くのをやめ、光で心を癒しなさい。心が見ている「私」が悲劇であろうとも、それは神の愛で包み込まれています。"},

{l:"光の記録を灯す",
t:"個人的なあなたは実在していません。あなたは個人的な「私」を、唯一実在の神の力によって創造しているに過ぎません。日々、**どんな私をも体験する機会を授かっているということを理解しなさい。**個人的な私の思考は全て幻想であり、思考による体験と選択を楽しんでいます。しかし、今も確かに、あなたの心は選択を通してこの世界というフィールドに記録を残しています。あなたの唯一の果たすべきことは、**全ての尊い意識が記録し体験しているこの世界に、光の記録を灯すこと**です。"},

{l:"不動の観察者",
t:"浮かんだ思考とそれに付随している感情をまずは認識しなさい。そして、個人的なあなたを通して体験していることを理解し、観察し、いかなる論証も因果も弁明も放棄しなさい。心は何の解決法もしりません。なぜなら、**解決すべきことは何もないからです。**ただ慈愛を持って、心の体験を眺めていなさい。そしてそこから止まることのない更なる体験も見守っていなさい。その不動の観察者は何にも影響を受けません。心が怯えている根本は「失う恐怖」です。しかし、元から何も失われるようには出来ていないことを思い出しなさい。あなたは神の創造のカルマの中にいます。"},

{l:"全ては赦されている",
t:"「出来ない」も「今ない」も全て個人的なあなたの心が選択したことだと理解しなさい。そしてそれらがすでに赦されていることを思い出しなさい。あなたはいかなる選択も赦されています。神はどんな条件も与えていません。**全てを赦し、心の「条件を与えること」すら赦している**のです。"},

{l:"ハート(体感)が知っている",
t:"心は測り、予測し、そして選択をします。しかし、ここには体感がありません。これらの選択から、ハートが体感を通して「知る」のです。どんな論証も測定も弁明も帰結から行いますが、その帰結に残る神の愛の体感を「知る」のはハートです。あなたの意識が本当に求めるものは、ハートが知っています。**心は事後処理しか行わないことを思い出しなさい。**どんな帰結からも体感が残るのは源の意識があるからです。そして、心が神に抵抗をしないほど、神の性質をそのまま受け取ることができます。つまり、**神の愛をそのまま素直に受け取る時、そこにハートが感じる体感こそが、あなたの本当に求めているもの**なのです。"},

{l:"何の問題もありません",
t:"あなたは愛や喜びや十全性の心地よさを知っています。これらが今、感じられていないのであれば、なんらかの抵抗が働いています。外の世界に原因はありません。ただ、心が翳りの中で処理をしているに過ぎません。愛や喜びを求めるのであれば、神に委ねればいいのです。そのためにまずは、あらゆる思考を手放しなさい。**個人的な「私」を完全に手放すのです**。神が無限に与えているエネルギーに浸りなさい。あなたの周りにあるもの全て、そしてあなた自身も今この瞬間に神によって与えられていることを思い出すのです。何の問題もありません。"},

{l:"遠慮をしてはならない",
t:"今与えられたと感じられる恩寵に、心の比較や論証を放棄して、じっくり味わいなさい。それらの恩寵は、あなたが正しかったからでも、あなたが特別なことを出来たからでもありません。**当然のように授かり、受け取り、選択してきたからです。**今いる部屋や、水や、心臓の鼓動や呼吸と同じように、あなたの求めるものは必ず与えられます。遠慮をしてはなりません。なぜなら、**「遠慮」は心が思考して得ようとするものだからです。**遠慮を恩寵と感じることはできますか。遠慮とは、**心が、神ではなく「自分」を真実だとした時に用意する選択肢です**。"},

{l:"神はあなたを毎瞬、祝福する",
t:"個人的なあなたはなくなりました。しかしこれは悲観することでは全くありません。**あなたは神を招き入れ、そして愛と共にあることを選択したのです。**個人的なあなたでいる時よりも、多くの存在に囲まれ、受け取り、与え、充実し、喜びに溢れた日々を送るでしょう。神はあなたを毎瞬、祝福します。"},

{l:"処理の手を止める",
t:"あなたの心は、今何をしていますか。現実世界でやらなくてはならないことや問題を想起し、何かを「正しい」と選択していますか。静かに観察してみなさい。そして、その心の全ての処理が、ただの処理であることを伝え、温かく見守ってやりなさい。**その心の信じている世界を全て包括しているのは、ルールも条件も何もない、ただ安心と喜びの世界です**。しかしこちらが正しいと、裁く必要もありません。もうすでに安心も愛も平和も喜びもここにあります。これらを曇らせないように、**ただ心が没頭している一心不乱の処理の手を止めるだけでいいのです**。"},

{l:"大手を振って喜びなさい",
t:"神に与えられたと感じたことがあったのなら、**大手を振って喜びなさい**。神は与える喜びを知っており、あなたのハートは受け取る喜びを生得的に知っています。これらは神の性質と同一だからです。欠如と獲得は心の機能ですが、源は無限です。減るものは何もありません。**最大限に愛を受け取り、受け取ったことをすべて心から喜びなさい**。あなたの辞書から欠如が消えた時、自ずと与える喜びも湧くでしょう。あなたは絶えず愛と喜びを受け取り、与える存在なのです。完全なる人生を歩みなさい。"},

{l:"あなたは何を与えたいのですか",
t:"あなたは神と一体です。あなたは「選択」する生来の機能を持っています。心が何を選択するかをよく観察していなさい。あなたは何を与えたいのですか。争い、苦しみ、それらから得る喜びという報酬ですか。そうではないはずです。**何の条件も犠牲もなく喜びと平和を与えることを望むのならば、まずはそのような信念をあなた自身が持つこと**です。苦しみは条件でも、それが達成できたら美徳ということでもありません。それは**個人的なあなたのプライドを満足させているだけだということに気付きなさい**。"},

{l:"神を恐れてはいけない",
t:"あなたが、**今ある全ての体験は自分自身の信念によるものだと悟る日々の実践こそが、あなた自身に神を招き入れる行動**なのです。全ての物事に対する喜びと愛の体感は、**あなたがどれだけ直接的に神を招き入れたかで反映されていきます**。苦労への虚栄心と自己陶酔によって知覚する物事がどのように体感されるかを、もうあなたは知っているでしょう。あなたが信じていた、苦しさ、被害者意識、それらへのプライドを通して知覚し続けても、あなたの本当に求めているものは見つかりません。**神は条件のない喜びと愛のみであることを信じなさい**。神を恐れてはいけません。恐れは個人的な「私」というエゴが知覚しているのです。"},

{l:"美は全てに在る",
t:"**心からの安心感、満足感、充実感は、これらの存在を何らかで認めた時に**現れます。そこに形があってもなくてもです。しかし心は機能上、これらの体感になんらかのきっかけを求めます。神をきっかけにするのが1番効率が良いのは言うまでもありませんが、神をどの位置から見ているかで、神にもきっかけを用意してしまいます。そしてあなたはこれまで、**神は「もう何の手の施し様子もないほど苦しい時のみ現れる存在」だと信じていました**。しかしそれは、**心が苦しい体験を”自分の力”で乗り越えたがっていた**に過ぎません。真実は、全て赦されているのです。**何の苦労もないことの、何が美しくないのでしょうか。美は全てに在ります**。美に限定性を持たせることこそが、目詰まりを起こしているのです。"},

{l:"物が下に落ちるように",
t:"あなたは個人的な「私」を認識することで神との分離を行なっています。神はどんな条件も超えています。まずはこれを悟りなさい。あなたは神の性質を、「何かを乗り越えてそうなった」と信じています。そうではありません。**あなた自身が「特別であるために分離が必要」だと、そのように信じている**のです。**「描いたら顕在する」ことも、あなたのカルマが特別なことにしたがっているだけ**なのです。物が下に落ちることは特別な能力によるものでしょうか。あなたの心臓や呼吸は何か特別なことを達成して動けていますか。これらの神の与えたものに対し、私たちは抵抗をしていません。実際にこれらは条件を伴いません。**条件や価値をつけているのは、あなたの心**です。"},

{l:"毎朝、まずは神を認識する",
t:"**毎朝、まずは神を認識しなさい**。神とは、全ての根源であり、全ての形や心の機能すらも包括している絶対的な存在です。そして、心の'獲得の動機'や'条件付け'といったプログラムを持たないため、否定的な体感を伴わない純粋な状態です。そこには無制限、無条件、完全なる自由、全知といった性質があり、また、**これらを感じている瞬間こそが喜びや平和といったものであるとあなたはすでに知っています**。これらを感じるのになんの特別な条件もありません。**それらを分析し解釈し証明しようとすることを放棄するだけ**でいいのです。"},

{l:"本来の力を取り戻す",
t:"あなたの神への献身の全ては、**あなた自身が本来の力を取り戻すこと**になるのです。本来の力とはまさしく、喜び、愛、平和、完全性、無限、調和そのものです。"},

{l:"神の偉大な力を讃美する",
t:"**個人的なあなたが無から作ったものは何ひとつないのだと知りなさい**。どんなものも源が流れているのみです。あなたは解釈し、自分の力で得たと信じています。しかし、その'個人的な自分'の力には限界があるのです。自我は局所的で制限的な思考を好みます。**神の偉大な力を讃美し、全ての線形的な因果と論証を放棄しなさい**。神は今もあなたを包み込んでいます。どんな望みも赦されています。"},

{l:"放棄して残るもの",
t:"あなたの平和と神の恩寵は今の「問題」が塞いでるわけではありません。**形に原因があると信じ続けるからこそ、変わらない**のです。**「問題」も「原因」もまた、神が赦した”個人的なあなたの求めるもののひとつ**であるだけなのです。外の世界を非難してはなりません。'問題'だと信じる事は、「解決法を探す」という新たな形を生みます。あなたはこの連鎖を放棄するだけで良いのです。**放棄して残るものこそが神の恩寵**なのです。"},

{l:"あなたは与える存在です",
t:"あなたは与える存在です。与える事の楽しさや喜びを知っています。個人的な私がやりくりした結果、与えるのではありません。条件を達成したから与えるのではありません。**源は無限であるため、無限に与えているだけ**です。それらはさまざまな形となり、展開し続けています。あなたも同じことです。"},

{l:"勇者像というコスミックジョーク",
t:"**苦労、義務感、窮屈さ、被害者意識、これらは全て自我の使う立ち位置であること**をよく理解しておきなさい。大抵の神への抵抗は全てこれらの立ち位置から生まれています。そしてそれらの核心は、自我が、**その”ネガティブに対抗する「私」”という悪に立ち向かう勇者像を通して、それへの虚栄心と共に「悪役」が必要な世界に永遠に自己陶酔している**というコスミックジョークなのです。"},

{l:"社会的な信念を受け入れる必要はない",
t:"どんなに苦労が「社会的に信じられている」信念であっても、それは神が”強制”しているものではありません。**被害者の立ち位置がそのように感じるだけ**です。その社会的な信念がネガティブな立ち位置に基づくものならば、むしろそれは**カルマの浄化のチャンス**です。経営者は厳しい世界だ、何かを求める事は浅はかだ、等、これらの信念を採用し続ける以上、その集合意識は継続されていきます。**あなたがそれを受け入れる必要はありません**。喜びや幸福感の恩寵の体感のみを信じなさい。"},

{l:"「簡単に」与えられる",
t:"**「何かを欲すること」「何かを受け取ること」に対する非難が自分の中にあることに気付きなさい**。そして、それらの非難はあなたの虚栄心から生まれていることを知りなさい。**「非難されることを私は行っていない」という誇りは、まさにプライドから来ている心の解釈**です。そしてそれこそが「私は受け取らない」という宣言であり、**その通りに帰結しているだけ**なのです。これらを明け渡すことで、あなたの本当に求めている**豊かさや喜びのツールは、「簡単に」与えられる**のです。"},

{l:"苦労は帰結しようがない",
t:"個人的な「私」の、**苦労や大変さを乗り越えてきたことに対するプライド**を手放しなさい。プライドは目標達成の「原因」にはなりません。プライドもまた、源のエネルギーによって存在できている一つのフィールドにすぎません。あなたは、**あなた自身の”プライド”によって、苦労や大変さが「必要」だった**のです。しかし、この虚栄心が手放されれば、それらの苦労は私にとって「必要」なものではなくなります。つまり、苦労や大変さは帰結しようがないのです。"},

{l:"あなた自身の神は、あなたにしか映せない",
t:"これらの言葉も「理解に過ぎないので真実では無い」と、まるでそれを「知って」いるかのように、また自我が虚栄心を働かせて否定することもあるでしょう。そして、**それもまた、そのように'否定'として帰結するだけ**なのです。体感は決して嘘をつけません。そして**体感は客観的に捉えようがなく、完全に主観的**なのです。あなた自身の神は、あなたにしか映せないのです。どんな抵抗すらも、**あなた自身が「求めているもの」の一つになっている**ことを知りなさい。神は永遠に赦しています。"},

{l:"立ち位置そのものに気づく",
t:"とめどなく溢れる**「思考」は全て何らかの立ち位置を反映して出力された「もの」である**と知りなさい。そして、それらを否定的な体感の「もの」だと認識したら、それは自我の自己陶酔の出力結果のひとつであると、慈愛を持って見つめるのです。否定的な思考と「同一化」する必要は一切ありません。**虚栄心を働かせるのではなく、否定的な立ち位置そのものに気づくのです**。"}
];

const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const fmt = s => esc(s).replace(/\*\*(.+?)\*\*/g,'<em class="hl">$1</em>');
const plain = s => s.replace(/\*\*/g,"");

const $ = id => document.getElementById(id);
const card=$("card"), dots=$("dots");
/* random order: a shuffled bag so every word appears before any repeats */
let bag=[];
function draw(exclude){
  if(!bag.length){
    bag=W.map((_,k)=>k);
    for(let a=bag.length-1;a>0;a--){const b=Math.floor(Math.random()*(a+1));[bag[a],bag[b]]=[bag[b],bag[a]]}
    if(bag.length>1 && bag[bag.length-1]===exclude){ [bag[0],bag[bag.length-1]]=[bag[bag.length-1],bag[0]] }
  }
  return bag.pop();
}
let i = draw(-1);
const hist=[];

W.forEach((w,k)=>{
  const d=document.createElement("button"); d.className="dot"; d.setAttribute("aria-label",(k+1)+"番目");
  d.onclick=e=>{e.stopPropagation(); go(k)}; dots.appendChild(d);
  const li=document.createElement("li");
  li.innerHTML='<button><span class="n">'+String(k+1).padStart(2,"0")+'</span><span class="l">'+esc(w.l)+'</span><span class="p">'+esc(plain(w.t))+'</span></button>';
  li.firstChild.onclick=()=>{closeIdx(); go(k)};
  $("list").appendChild(li);
});

function render(){
  const w=W[i];
  $("num").textContent=String(i+1).padStart(2,"0")+" / "+String(W.length).padStart(2,"0");
  $("label").textContent=w.l;
  $("text").innerHTML=fmt(w.t);
  $("count").textContent=(i+1)+" / "+W.length;
  $("prev").style.visibility = hist.length ? "visible" : "hidden";
  [...dots.children].forEach((d,k)=>d.classList.toggle("on",k===i));
  card.scrollTop=0;
}
let busy=false;
function go(k, fromBack){
  if(busy) return;
  if(k===i){render();return}
  if(!fromBack) hist.push(i);
  busy=true; card.classList.add("out");
  setTimeout(()=>{i=k; render(); card.classList.remove("out"); busy=false},300);
}
render();

function next(){ go(draw(i)) }
function back(){ if(hist.length && !busy) go(hist.pop(), true) }
$("next").onclick=e=>{e.stopPropagation(); next()};
$("prev").onclick=e=>{e.stopPropagation(); back()};

/* tap: left fifth = back, elsewhere = next; ignore scroll / swipe handled separately */
let sx=0, sy=0, st=0, moved=false;
const stage=$("stage");
stage.addEventListener("touchstart",e=>{const t=e.touches[0]; sx=t.clientX; sy=t.clientY; st=Date.now(); moved=false},{passive:true});
stage.addEventListener("touchmove",e=>{const t=e.touches[0]; if(Math.abs(t.clientX-sx)>10||Math.abs(t.clientY-sy)>10) moved=true},{passive:true});
stage.addEventListener("touchend",e=>{
  const t=e.changedTouches[0], dx=t.clientX-sx, dy=t.clientY-sy;
  if(Math.abs(dx)>60 && Math.abs(dx)>Math.abs(dy)*1.5){ dx<0?next():back(); e.preventDefault(); return; }
  if(!moved && Date.now()-st<500){ tapAt(t.clientX); e.preventDefault(); }
});
stage.addEventListener("click",e=>{ if(window.getSelection && String(window.getSelection())) return; tapAt(e.clientX) });
function tapAt(x){
  const r=stage.getBoundingClientRect();
  (x-r.left) < r.width*0.2 ? back() : next();
}
document.addEventListener("keydown",e=>{
  if(e.key==="ArrowRight"||e.key===" ") next();
  if(e.key==="ArrowLeft") back();
  if(e.key==="Escape") closeIdx();
});

$("openIndex").onclick=()=>$("overlay").classList.add("show");
$("closeIndex").onclick=closeIdx;
function closeIdx(){$("overlay").classList.remove("show")}
</script>
