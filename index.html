<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">

<!-- ホーム画面から開いた時、アプリのように全画面で表示 -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<!-- アイコンの下に出る名前 -->
<meta name="apple-mobile-web-app-title" content="信条">
<meta name="theme-color" content="#FBF7F0">
<!-- ホーム画面のアイコン(同じフォルダに置く) -->
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<title>信条</title>

<style>
  :root {
    --bg:        #FBF7F0;
    --bg-glow:   #FFF3DC;
    --card:      rgba(255, 255, 255, 0.72);
    --ink:       #4A4038;
    --ink-soft:  #8A7D70;
    --gold:      #C9A15A;
    --gold-soft: #E8D3A8;
    --line:      rgba(201, 161, 90, 0.28);
    --mincho: "Hiragino Mincho ProN", "Yu Mincho", "YuMincho", "Noto Serif JP", serif;
    --gothic: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    min-height: 100vh;
    min-height: 100dvh;
    background:
      radial-gradient(120% 60% at 50% 0%, var(--bg-glow) 0%, transparent 70%),
      var(--bg);
    color: var(--ink);
    font-family: var(--mincho);
    line-height: 2;
    letter-spacing: 0.06em;
    -webkit-font-smoothing: antialiased;
    padding:
      calc(env(safe-area-inset-top) + 40px)
      calc(env(safe-area-inset-right) + 24px)
      calc(env(safe-area-inset-bottom) + 48px)
      calc(env(safe-area-inset-left) + 24px);
  }

  main {
    max-width: 520px;
    margin: 0 auto;
    animation: rise 1.4s ease both;
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: none; }
  }

  /* 見出し */
  .label {
    font-family: var(--gothic);
    font-size: 11px;
    letter-spacing: 0.32em;
    color: var(--gold);
    text-align: center;
    margin-bottom: 28px;
  }

  h1 {
    font-weight: 500;
    font-size: 22px;
    letter-spacing: 0.18em;
    text-align: center;
    margin-bottom: 32px;
  }

  /* 信条の本文 */
  .creed p {
    font-size: 16.5px;
    line-height: 2.15;
    text-align: center;
    margin-bottom: 0.9em;
  }
  .creed p:last-child { margin-bottom: 0; }

  /* 区切りの星 */
  .divider {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    margin: 44px 0;
    color: var(--gold);
  }
  .divider::before,
  .divider::after {
    content: "";
    width: 56px;
    height: 1px;
    background: var(--line);
  }
  .divider svg { width: 14px; height: 14px; }

  /* 今日の一節 */
  .passage {
    margin-top: 56px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 32px 24px 24px;
    box-shadow: 0 10px 40px -20px rgba(150, 110, 50, 0.35);
    -webkit-backdrop-filter: blur(6px);
    backdrop-filter: blur(6px);
  }

  .passage .label { margin-bottom: 20px; }

  #quote {
    font-size: 15.5px;
    line-height: 2.1;
    text-align: center;
    min-height: 6.3em;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: opacity 0.6s ease;
  }
  #quote.fade { opacity: 0; }

  #source {
    font-family: var(--gothic);
    font-size: 11px;
    letter-spacing: 0.12em;
    color: var(--ink-soft);
    text-align: center;
    margin-top: 18px;
    transition: opacity 0.6s ease;
  }
  #source.fade { opacity: 0; }

  .again {
    display: block;
    margin: 22px auto 0;
    font-family: var(--gothic);
    font-size: 12px;
    letter-spacing: 0.2em;
    color: var(--gold);
    background: transparent;
    border: 1px solid var(--gold-soft);
    border-radius: 999px;
    padding: 10px 22px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: background 0.3s ease;
  }
  .again:active { background: var(--bg-glow); }

  footer {
    margin-top: 40px;
    text-align: center;
    font-family: var(--gothic);
    font-size: 10px;
    letter-spacing: 0.3em;
    color: var(--gold-soft);
  }
</style>
</head>
<body>
<main>

  <section class="creed">
    <p class="label">MY CREED</p>
    <h1>“私”の信条</h1>
  <p>すべてのコンテントは、もう完成されている。</p>
    <p>作るのは「自己」、<br>“私”は焦点を選ぶだけ。</p>
    <p>この身は、恩寵が流れる水の通り道。</p>
    <p>心は何も知らない。<br>だからこそ、全ての抵抗を明け渡し、<br>「自己」の源に委ねる。</p>
   
  </section>

  <section class="passage">
    <p class="label">TODAY'S PASSAGE</p>
    <p id="quote"></p>
    <p id="source"></p>
    <button class="again" type="button" onclick="showPassage()">もうひとつ</button>
  </section>

  <footer>✦</footer>
</main>

<script>
  /* ──────────────────────────────────────────
     一節のリスト
     新しい気づきが生まれたら、ここに足していけばOK。
     書き方:{ text: "本文", source: "出典" },
     ※ 本文の中で改行したい所には <br> を入れる
  ────────────────────────────────────────── */
  const passages = [
    { text: "私たちが体験している現実は、<br>実在の世界そのものではなく、<br>心が立ち位置とその信念に沿って組み立てた、<br>体験という完成品。", source: "2026.10.25 の気づき" },
    { text: "五感を通して刺激を受け取ることと、<br>それを「在る」と存在させることは、<br>まったく別の働き。", source: "2026.10.25 の気づき" },
    { text: "心は意味を与えた時にはじめて、<br>“それ”を「在る」ものとして存在させる。", source: "2026.10.25 の気づき" },
    { text: "心の中と有形の世界の境界は、<br>むしろ無い。", source: "2026.10.25 の気づき" },
    { text: "「でも、まだないじゃん」という問いを握りしめるたびに、<br>心は「ない」ということを<br>在るものとして存在させてしまう。", source: "2026.10.25 の気づき" },
    { text: "不在に存在を与え続ける代わりに、<br>豊かさに存在を与える方を選ぶ。", source: "2026.10.25 の気づき" },
    { text: "願いを「まだないもの」として置けば不在が体験され、<br>「すでに在るもの」として置けば、<br>それが体験され始める。", source: "2026.10.25 の気づき" },
    { text: "何かが実体を持つためには、<br>まず心の中で「在る」ものに<br>なっている必要がある。", source: "2026.10.25 の気づき" },
    { text: "不在にさえ確かな実体を与えられる力が、<br>もう備わっている。<br>その同じ力を、美しい景色の方へ向けるだけでいい。", source: "2026.10.25 の気づき" },
    { text: "確信とは、まだないものを在ると思い込む努力ではなく、<br>いつも自然にしている「在らしめる」働きを、<br>選び直すこと。", source: "2026.10.25 の気づき" },
    { text: "「無い」という欠乏感の存在は、<br>愛の不在と言えるでしょう。<br>しかし、存在は必ず赦されています。", source: "2026.10.25 の気づき" },
    { text: "確信とは、数字を見ても、<br>もう「大変」も「本当に？」も浮かばない状態。<br>「なんか余った」くらいの軽さで、<br>そこに在ると知っていること。", source: "2026.10.25 の気づき" },
    { text: "「でも、まだないじゃん」という問いに、<br>答えようとしなくていい。", source: "2026.10.25 の気づき" },
    { text: "確信するために「根拠」を<br>有形の世界から得ようとする動き自体が、<br>富や成功の実現を困難にする自我のプログラム。", source: "2026.10.25 の気づき" },
    { text: "立ち位置に気づき、手放した時に、<br>同じ世界から違うものが在らしめられ始める。", source: "2026.10.25 の気づき" },
    { text: "新しいものが来たのではなく、<br>ずっとそこにあったものが、<br>ようやく体験として現れる。", source: "2026.10.25 の気づき" },
    { text: "心は何も知らないという謙虚さとともに、<br>「自己」に預ける。", source: "2026.10.25 の気づき" },
    { text: "ふっと浮かぶアイデアや、連絡したくなる相手や、<br>やってみたくなる一筆があれば、<br>軽やかに乗っていく。", source: "2026.10.25 の気づき" },
    { text: "立ち位置そのものは、<br>考えることではなく、手放すことで変わる。", source: "2026.10.25 の気づき" },
    { text: "その組み立てのすべてを照らしている光が「自己」であり、<br>清書は「自己」がしてくれる。", source: "2026.10.25 の気づき" }
  ];

  const quoteEl = document.getElementById("quote");
  const sourceEl = document.getElementById("source");
  let last = -1;

  function pick() {
    if (passages.length < 2) return 0;
    let i;
    do { i = Math.floor(Math.random() * passages.length); } while (i === last);
    return i;
  }

  function render(i) {
    quoteEl.innerHTML = passages[i].text;
    sourceEl.textContent = "— " + passages[i].source;
    last = i;
  }

  function showPassage() {
    quoteEl.classList.add("fade");
    sourceEl.classList.add("fade");
    setTimeout(() => {
      render(pick());
      quoteEl.classList.remove("fade");
      sourceEl.classList.remove("fade");
    }, 600);
  }

  // 開くたびにランダムで一節
  render(pick());

  // ホーム画面のアプリは裏に残るので、戻ってきた時にも新しい一節に
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible") showPassage();
  });
</script>

  <div class="divider" aria-hidden="true">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 0 L14 10 L24 12 L14 14 L12 24 L10 14 L0 12 L10 10 Z"/></svg>
  </div>

  <section class="creed">
   <p>豊かさは、作るものではなく、選ぶもの。</p>
    <p>売上も、ご縁も、作品も、<br>すでに「自己」の中に在る。</p>
    <p>私の仕事は、苦労の星ではなく、<br>喜びの星に焦点を合わせること。</p>
    <p>スタッフの感性を曇らせず、<br>恩寵が流れる通り道であり続けること。</p>
    <p>そして、生まれた利益と富を、<br>世界へ巡らせること。</p>
  </section>
</body>
</html>
